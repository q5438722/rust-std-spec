schema_version = 1
offline = true

[project]
root = "../../.."

[language]
name = "verus"

[targets]
include = [
    "proofs/completeness/slice/inputs/make_ascii_uppercase.rs",
    "proofs/completeness/slice/inputs/make_ascii_lowercase.rs",
]
exclude = [
    "toolchain/**", "inventory/**", "scripts/**", "tests/**", "issues/**",
    "logs/**", "target/**", ".autors/**", ".argus_subagents/**",
    "native-singleton-*/**", "proofs/correctness/**",
    "proofs/completeness/slice/runs/**",
]
visibility = "public"

[build]
adapter = "verus.single_file"
extra_args = ["--crate-type", "lib"]

[adapters.verus]
executable = "../../../toolchain/verus-x86-linux/verus"
rust_toolchain = "1.98.1-x86_64-unknown-linux-gnu"
extra_args = ["--num-threads", "1"]

[analysis]
kind = "concrete_determinism"
observation_policy = "verus-observable-v1"

[artifacts]
output_dir = "runs/ascii-case"

[assistance]
mode = "off"
