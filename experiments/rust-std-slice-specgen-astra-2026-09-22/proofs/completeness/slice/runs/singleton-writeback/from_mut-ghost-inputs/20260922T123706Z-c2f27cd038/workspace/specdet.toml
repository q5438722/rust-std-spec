schema_version = 1
offline = true

[project]
root = "."
type_sources = ["specs/slice/mod.rs"]

[language]
name = "verus"

[targets]
include = ["proofs/completeness/slice/inputs/*.rs"]
exclude = [
    "toolchain/**", "inventory/**", "scripts/**", "tests/**", "issues/**",
    "logs/**", "target/**", ".autors/**", ".argus_subagents/**",
    "proofs/correctness/**", "proofs/completeness/slice/runs/**",
    "proofs/completeness/slice/len.rs",
    "proofs/completeness/slice/is_empty.rs",
    "proofs/completeness/slice/first.rs",
    "proofs/completeness/slice/split_first.rs",
    "proofs/completeness/slice/split_last.rs",
    "proofs/completeness/slice/last.rs",
]
visibility = "public"

[build]
adapter = "verus.single_file"
extra_args = ["--crate-type", "lib"]

[adapters.verus]
executable = "toolchain/verus-x86-linux/verus"
rust_toolchain = "1.98.1-x86_64-unknown-linux-gnu"
extra_args = ["--num-threads", "1"]

[analysis]
kind = "concrete_determinism"
observation_policy = "verus-observable-v1"

[artifacts]
output_dir = "proofs/completeness/slice/runs"

[assistance]
mode = "off"
